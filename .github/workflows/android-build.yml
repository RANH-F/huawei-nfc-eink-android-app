name: Android APK and protocol tests

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run Java protocol and NFC diagnosis tests
        run: python3 tests/run_java.py
      - name: Build signed debug APK and SHA256
        run: python3 build.py
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: QPollLab-diagnostic-apk
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
